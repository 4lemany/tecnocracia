# 🏛️ Google Cloud Build Pipeline para Tecnocracia
steps:
  # 1. Pruebas y validación del código
  - name: 'python:3.12-slim'
    id: 'run-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pytest tests/ -v

  # 2. Compilación de la imagen Docker optimizada
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia:latest'
      - '.'

  # 3. Subida a Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia'

  # 4. Despliegue en Google Cloud Run (Serverless, min-instances 0)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tecnocracia'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,USE_FIRESTORE=true'

substitutions:
  _REGION: 'europe-west1'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/tecnocracia-repo/tecnocracia:latest'

options:
  logging: CLOUD_LOGGING_ONLY
