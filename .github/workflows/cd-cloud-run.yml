name: CD - Despliegue Continuo a Google Cloud Run (Coste Cero)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: europe-west1
  REPOSITORY: tecnocracia-repo
  SERVICE: tecnocracia-app
  REGION: europe-west1

jobs:
  deploy:
    name: Despliegue en Google Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      # Autenticación segura con Google Cloud
      # Soporta Workload Identity Federation (WIF) si existe, o Service Account Key (JSON)
      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Autenticar Docker con Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Construcción y publicación de la imagen en Artifact Registry
      - name: Construir y etiquetar imagen Docker
        run: |
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          LATEST_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest"
          
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Despliegue a Cloud Run con los parámetros del nivel gratuito (Free Tier Siempre Gratuito)
      # - min-instances: 0 -> Escala a CERO en reposo (0€ de consumo)
      # - max-instances: 1 -> Límite estricto de protección contra costes
      # - memory: 512Mi, cpu: 1 -> Dentro del tramo perpetuo gratuito de Cloud Run
      - name: Desplegar servicio en Google Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE_URI }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --port=8080 \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --quiet

      - name: Mostrar URL de acceso público
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "=========================================================="
          echo "🚀 Despliegue completado con éxito a coste cero!"
          echo "🌐 URL de la aplicación: $SERVICE_URL"
          echo "=========================================================="
